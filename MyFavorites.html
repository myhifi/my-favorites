    body {

    th {

    #myClockDisplay {

    }
    .category { display: none; }

    // ========== RENDER ==========
    function renderTable(category, sites) {
      let html = `<div class="category" data-category="${category}">`;
      html += `<table><caption>${category}</caption>`;
      html += "<tr><th>[ Site Name ]</th><th>[ URL ]</th></tr>";
      sites.forEach(site => {
        html += `<tr><td><span class="site-title">${site.title}</span>`;
        if (site.description) {
          html += `<div class="description">${site.description}</div>`;
        }
        html += `</td><td><a href="${site.link}" target="_blank" rel="noopener noreferrer">${site.link}</a></td></tr>`;
      });
      html += "</table></div>";
      return html;
    }

    const container = document.getElementById("tablesContainer");
    const select = document.getElementById("categorySelect");

    Object.keys(siteData).forEach(category => {
      select.innerHTML += `<option value="${category}">${category}</option>`;
      container.innerHTML += renderTable(category, siteData[category]);
    });

    function showCategory(value) {
      document.querySelectorAll(".category").forEach(div => {
        div.style.display = (value === "all" || div.dataset.category === value) ? "block" : "none";
      });
    }
    select.addEventListener("change", () => { showCategory(select.value); applySearch(); });
    showCategory("all");

    // ========== SEARCH ==========
    const searchInput = document.getElementById("searchInput");
    function applySearch() {
      const term = searchInput.value.toLowerCase();
      document.querySelectorAll(".category").forEach(div => {
        if (div.style.display === "none") return;
        div.querySelectorAll("tr").forEach((row, idx) => {
          if (idx === 0) return;
          const text = row.innerText.toLowerCase();
          row.style.display = text.includes(term) ? "" : "none";
        });
      });
    }
    searchInput.addEventListener("input", applySearch);

    // ========== CLOCK ==========
    let clockInterval;
    function updateClock() {
      const now = new Date();
      const optionsDay = { weekday: 'short' };
      const optionsMonthYear = { month: 'long', year: 'numeric' };
      const day = now.toLocaleDateString('en-US', optionsDay);
      const monthYear = now.toLocaleDateString('en-US', optionsMonthYear);
      const date = now.getDate().toString().padStart(2, '0');
      const formattedDate = `${day} ${date} ${monthYear}`;
      const formattedTime = now.toLocaleTimeString('en-US');
      document.getElementById('myClockDisplay').innerHTML = `${formattedDate} ${formattedTime}`;
    }
    function toggleClockUpdate() {
      const checkbox = document.getElementById('clockUpdateCheckbox');
      if (checkbox.checked) {
        clearInterval(clockInterval);
        updateClock();
        clockInterval = setInterval(updateClock, 1000);
      } else {
        clearInterval(clockInterval);
      }
    }
    updateClock();
    clockInterval = setInterval(updateClock, 1000);
    document.getElementById('clockUpdateCheckbox').addEventListener('change', toggleClockUpdate);

    // ========== AlAdhan API for Next Prayer==========
    let userCity = "Cairo";
    let userCountry = "Egypt";
    let prayerInterval;

    // ---------- HELPERS ----------
    function to12Hour(time24) {
      let [h, m] = time24.split(":");
      h = parseInt(h);
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return `${h}:${m} ${ampm}`;
    }

    function timeToDate(time) {
      const [h, m] = time.split(":");
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d;
    }

    // ---------- FETCH PRAYERS ----------
    async function fetchPrayerTimes() {
      const url = `https://api.aladhan.com/v1/timingsByCity?city=${userCity}&country=${userCountry}&method=5`;
      const res = await fetch(url);
      const data = await res.json();
      return data.data.timings;
    }

    // ---------- MAIN LOGIC ----------
    async function updateNextPrayer() {
      const timings = await fetchPrayerTimes();
      const now = new Date();

      const prayers = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];

      let nextPrayerName, nextPrayerTime;

      for (let p of prayers) {
        const t = timeToDate(timings[p]);
        if (t > now) {
          nextPrayerName = p;
          nextPrayerTime = t;
          break;
        }
      }

      // After Isha → tomorrow Fajr
      if (!nextPrayerName) {
        nextPrayerName = "Fajr";
        nextPrayerTime = timeToDate(timings.Fajr);
        nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
      }

      startCountdown(nextPrayerName, nextPrayerTime, timings);
    }

    // ---------- COUNTDOWN ----------
    function startCountdown(name, time, timings) {
      clearInterval(prayerInterval);

      prayerInterval = setInterval(() => {
        const now = new Date();
        const diff = time - now;

        if (diff <= 0) {
          updateNextPrayer();
          return;
        }

        const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
        const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
        // const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");

        document.getElementById("countdown").innerText = `Next Prayer timer ⏳ ${h}:${m}`;

        // 12h format
        const prayerTime12 = to12Hour(timings[name]);

        const textEl = document.getElementById("nextPrayerText");
        textEl.innerText = `${userCity} — Next Prayer: ${name} at ${prayerTime12}`;

        // 🔴 Color sync (red if ≤15 min)
        textEl.style.color = diff <= 15 * 60000 ? "red" : "black";
      }, 1000);
    }

    // ---------- GEOLOCATION ----------
    document.getElementById("detectLocationBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
      }

      navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        const res = await fetch(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`
        );
        const data = await res.json();

        userCity = data.city || data.locality;
        userCountry = data.countryName;

        updateNextPrayer();
      });
    });

    // ---------- START ----------
    updateNextPrayer();

  </script>
